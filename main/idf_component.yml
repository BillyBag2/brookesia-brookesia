dependencies:
  idf: ">=6.1"
  # Minimal ESP-Brookesia stack for a graphical touch system.
  espressif/brookesia_system_super:
    version: "0.8.*"
  espressif/brookesia_gui_lvgl:
    version: "0.8.*"
  # brookesia_gui_lvgl 0.8.4 uses lv_fs_path_ex_t as a public complete type;
  # LVGL 9.3 only exposes a forward declaration for it.
  lvgl/lvgl:
    version: "9.4.0"
  espressif/brookesia_hal_adaptor:
    version: "0.8.*"
  espressif/brookesia_service_device:
    version: "0.8.*"
  # Speaker/microphone playback and capture services used by the audio demos.
  espressif/brookesia_service_audio:
    version: "0.8.*"
    override_path: "../components/brookesia_service_audio"
  # Standalone codec library for file-backed MP3 playback. This does not pull
  # in the incompatible ESP-SR/AV-processor stack.
  espressif/esp_audio_codec:
    # 2.6.x requires ESP32-P4 revision 3; the TAB5 board is revision 1.
    version: ">=2.5.0,<2.6.0"
  espressif/brookesia_app_settings:
    version: "0.8.3"
  joltwallet/littlefs:
    version: "^1.20.4"

  # TAB5 LCD and touch definitions for the HAL adaptor's Board Manager.
  # Keep this on 0.5.x to match the adaptor's esp_board_manager dependency.
  espressif/esp_board_manager:
    version: "0.5.*"
  espressif/m5stack_boards:
    version: "0.5.*"

  espressif/esp_hosted:
    # brookesia_hal_adaptor 0.8.x requires this exact ESP-Hosted release
    # when its Wi-Fi device implementation is enabled.
    version: "2.12.3"
    rules:
      - if: "target == esp32p4"
